name: Sync to public repo

on:
  push:
    branches:
      - v4
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove draft content
        run: python3 scripts/filter-drafts.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Push to public repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # Set up public repo as a remote
          git remote add public https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/keepwatch/thrivingdefense.git

          # Stage deletions (removed draft files) and commit
          git add -A
          if git diff --cached --quiet; then
            echo "No draft files to remove — syncing as-is."
          else
            git commit -m "chore: remove drafts before sync [skip ci]"
          fi

          # Force-push current state to public repo v4 branch
          git push public HEAD:v4 --force
